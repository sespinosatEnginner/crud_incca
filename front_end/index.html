<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de tareas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <div>
        <h1>Gestor de tareas</h1>
        <p class="sub">CRUD INCCA · Ingeniería de Software III</p>
      </div>
      <button id="btn-nueva" class="btn btn-primario" type="button">+ Nueva tarea</button>
    </header>

    <div id="alerta" class="alerta oculto" role="alert">
      <span id="alerta-texto"></span>
      <button id="alerta-cerrar" class="alerta-cerrar" type="button" aria-label="Cerrar alerta">×</button>
    </div>

    <section class="tarjetas" aria-label="Resumen">
      <article class="tarjeta">
        <span class="tarjeta-titulo">Total</span>
        <strong id="n-total">0</strong>
      </article>
      <article class="tarjeta">
        <span class="tarjeta-titulo">Pendientes</span>
        <strong id="n-pendientes">0</strong>
      </article>
      <article class="tarjeta">
        <span class="tarjeta-titulo">Completadas</span>
        <strong id="n-completadas">0</strong>
      </article>
    </section>

    <section class="tabla-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Estado</th>
            <th>Creada</th>
            <th class="col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <p id="mensaje-tabla" class="mensaje-tabla">Cargando tareas...</p>
    </section>
  </main>

  <!-- Modal: crear / editar -->
  <dialog id="modal-form">
    <form id="form-tarea" novalidate>
      <h2 id="modal-form-titulo">Nueva tarea</h2>

      <label for="titulo">Título</label>
      <input type="text" id="titulo" name="titulo" maxlength="300" autocomplete="off" />
      <small id="error-titulo" class="error-campo"></small>

      <label id="fila-completada" class="fila-check oculto">
        <input type="checkbox" id="completada" />
        Marcar como completada
      </label>

      <div class="modal-botones">
        <button type="button" id="btn-cancelar" class="btn">Cancelar</button>
        <button type="submit" id="btn-guardar" class="btn btn-primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Modal: confirmar eliminación -->
  <dialog id="modal-eliminar">
    <h2>Eliminar tarea</h2>
    <p id="texto-eliminar"></p>
    <div class="modal-botones">
      <button type="button" id="btn-no-eliminar" class="btn">Cancelar</button>
      <button type="button" id="btn-si-eliminar" class="btn btn-peligro">Sí, eliminar</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
